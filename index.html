<script>
/* ============ لوحة الألوان (7 ألوان) ============ */
const PALETTE = ['#e53935','#ff5722','#ff9800','#ffc107','#cddc39','#4caf50','#00c853'];

function hexToRgb(h){
  h = h.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function colorAt(percent){
  const t = Math.max(0, Math.min(1, percent/100)) * (PALETTE.length - 1);
  const i = Math.min(PALETTE.length - 2, Math.floor(t));
  const f = t - i;
  const a = hexToRgb(PALETTE[i]);
  const b = hexToRgb(PALETTE[i+1]);
  const c = a.map((v,k) => Math.round(v + (b[k]-v) * f));
  return '#' + c.map(v => v.toString(16).padStart(2,'0')).join('');
}

/* ============ الدالة الأساسية ============ */
window.updateProgress = function(percent){

  percent = Number(percent);

  if (!Number.isFinite(percent))
    return;

  percent = Math.max(0, Math.min(100, percent));

  const p = Math.round(percent);
  const color = colorAt(p);

  // ===== الأشرطة =====
  const cbar = document.getElementById('consoleBarFill');
  const bbar = document.getElementById('bottomBarFill');

  if (cbar) {
    cbar.style.width = p + '%';
    cbar.style.background =
      `linear-gradient(90deg,
        ${color},
        ${colorAt(Math.min(100, p + 12))})`;
    cbar.style.boxShadow = `0 0 12px ${color}`;
  }

  if (bbar) {
    bbar.style.width = p + '%';
    bbar.style.background =
      `linear-gradient(90deg,
        ${color},
        ${colorAt(Math.min(100, p + 12))})`;
    bbar.style.boxShadow = `0 0 16px ${color}`;
  }

  // ===== JBSTATUS =====
  const jb = document.getElementById('jbStatus');

  if (jb) {

    const m = jb.textContent.match(/^[^(]+/);

    jb.textContent =
      `${m ? m[0].trim() : 'JB Injection'} (${p}%)`;

    // نفس لون شريط التقدم
    jb.style.color = color;

    // نفس تأثير الإضاءة
    jb.style.textShadow =
      `0 0 8px ${color}, 0 0 14px ${color}`;

    // انتقال ناعم
    jb.style.transition =
      'color .35s ease, text-shadow .35s ease';
  }
};
</script>

<script>
/* =====================================================
   PS5 LIVE IP READER
   Standalone IP reader - index.html
   Source: WKALI API (port 1022)
   ===================================================== */
(function () {
  'use strict';

  var IP_KEY = 'WKAL_LAN_IP';
  var API = 'http://127.0.0.1:1022/api/netinfo';
  var started = false;
  var busy = false;

  function validIP(ip) {
    if (typeof ip !== 'string') return false;

    var p = ip.trim().split('.');
    if (p.length !== 4) return false;

    for (var i = 0; i < 4; i++) {
      if (!/^\d{1,3}$/.test(p[i])) return false;

      var n = Number(p[i]);
      if (n < 0 || n > 255) return false;
    }

    return ip.indexOf('127.') !== 0 &&
           ip !== '0.0.0.0' &&
           ip !== '255.255.255.255';
  }

  function showIP(ip) {
    var el = document.getElementById('ldIp');
    if (el && ip) el.textContent = ip;
  }

  function getSavedIP() {
    try {
      var ip = localStorage.getItem(IP_KEY);
      return validIP(ip) ? ip : '';
    } catch (e) {
      return '';
    }
  }

  function saveIP(ip) {
    try {
      localStorage.setItem(IP_KEY, ip);
    } catch (e) {}
  }

  function readIP() {
    if (busy) return;
    busy = true;

    var xhr = new XMLHttpRequest();

    xhr.open('GET', API + '?t=' + Date.now(), true);
    xhr.timeout = 4000;

    xhr.onload = function () {
      busy = false;

      if (xhr.status < 200 || xhr.status >= 300) return;

      try {
        var data = JSON.parse(xhr.responseText || '{}');
        var ip = data && typeof data.ip === 'string'
          ? data.ip.trim()
          : '';

        if (validIP(ip)) {
          saveIP(ip);
          showIP(ip);

          /* Update WKAL state if available */
          if (window.WKAL && window.WKAL.state) {
            window.WKAL.state.lanIp = ip;
          }
        }
      } catch (e) {}
    };

    xhr.onerror = function () {
      busy = false;
    };

    xhr.ontimeout = function () {
      busy = false;
    };

    try {
      xhr.send();
    } catch (e) {
      busy = false;
    }
  }

  function start() {
    if (started) return;
    started = true;

    /* Show saved IP immediately */
    var saved = getSavedIP();

    if (saved) showIP(saved);

    /* Read live IP */
    readIP();

    /* Retry periodically */
    setInterval(readIP, 10000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

})();
</script>
