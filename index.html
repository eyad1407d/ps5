<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>PS5 Y2JB Autoloader</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    font-family: monospace;
    background: #000;
    color: #fff;
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
  }

  /* ===== الخلفية ===== */
  #bg {
    position: fixed; inset: 0;
    background-image: url("pic0.png");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: cover;
    z-index: 0;
  }
  #bg::after {
    content: "";
    position: absolute; inset: 0;
    background: rgba(0,0,0,.15);
  }

  /* ===== الإطار الرئيسي ===== */
  #app {
    position: relative;
    z-index: 1;
    width: 90vw;
    height: 88vh;
    margin: 6vh auto;
    padding: 16px 22px 18px;
    border-radius: 18px;
    background: rgba(10,10,12,.28);
backdrop-filter: blur(3px);
-webkit-backdrop-filter: blur(3px);
    border: 1px solid rgba(140,100,40,.45);
    box-shadow:
      0 0 80px rgba(0,0,0,.85),

    flex-direction: column;
    gap: 12px;
  }

  /* ===== الترويسة ===== */
  .header {
    text-align: center;
    color: #f4c842;
    font-size: clamp(11px, 1.05vw, 15px);
    line-height: 1.55;
    letter-spacing: .6px;
    text-shadow: 0 0 14px rgba(244,200,66,.45);
    border-bottom: 1px solid rgba(180,140,40,.35);
    padding-bottom: 8px;
    flex: 0 0 auto;
  }
  .header .line {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }
  .header .sep { color: rgba(180,150,60,.75); }
  .header .bolt { color: #ffe066; }

  /* ===== الألواح ===== */
  .panels {
    flex: 1;
    display: flex;
    gap: 14px;
    min-height: 0;
  }

  .panel {
    border-radius: 14px;
    border: 2px solid #c1121f;
    box-shadow:
      0 0 22px rgba(193,18,31,.45),
      0 0 60px rgba(193,18,31,.15),
      inset 0 0 34px rgba(193,18,31,.09);
    background: rgba(8,8,10,.22);
backdrop-filter: blur(2px);
-webkit-backdrop-filter: blur(2px);
    padding: 12px;
    min-height: 0;
  }

  /* ----- اللوح الأيسر: بطاقات الحالة ----- */
  .left-panel {
    flex: 0 0 24%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: auto;
  }

  .card {
    border: 1px solid rgba(193,18,31,.55);
    border-radius: 10px;
    padding: 8px 10px 9px;
    background: linear-gradient(
    180deg,
    rgba(25,12,12,.20),
    rgba(10,6,6,.16)
);
backdrop-filter: blur(2px);
-webkit-backdrop-filter: blur(2px);
    text-align: center;
    font-size: clamp(10px, .92vw, 14px);
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .card .label {
    color: #f4c842;
    font-weight: 700;
    letter-spacing: 1.5px;
    font-size: clamp(9px, .85vw, 13px);
  }
  .card .value {
    color: #eaeaea;
    margin-top: 3px;
    letter-spacing: .5px;
  }
  .card.alert .value {
    color: #ff3b3b;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(255,60,60,.5);
  }

  /* ----- اللوح الأيمن: الكونسول ----- */
  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
    padding: 14px 16px 22px;
    overflow: hidden;
}

/* ===== الكونسول: كامل مساحة اللوح الأيمن ===== */

.right-panel #console {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    min-height: 0;

    overflow: hidden;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    padding: 10px 12px;

    box-sizing: border-box;

    font-size: 12px;
    line-height: 1.4;

    background: rgba(0,0,0,.12);
    border-radius: 8px;
}

/* كل سطر */
.right-panel #console > div {
    flex: 0 0 auto;

    min-height: 22px;

    display: flex;
    align-items: center;

    padding: 0 4px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* مسافة إضافية بين الأسطر */
.right-panel #console > div + div {
    margin-top: 8px;
}

  .console-out {
    flex: 1;
    overflow: auto;
    font-size: clamp(10px, .92vw, 13.5px);
    line-height: 1.75;
    color: #dcdcdc;
    white-space: pre-wrap;
    word-break: break-word;
    letter-spacing: .3px;
  }
  .console-out .green { color: #35d07f; }
  .console-out .err   { color: #ff5a5a; }
  .console-out .ok    { color: #9be15d; }
  .console-out .dim   { color: #9a9a9a; }

  /* شريط أخضر صغير أسفل نافذة الكونسول */
  .console-bar {
    position: relative;
    width: calc(100% - 18px);
    height: 13px;
    margin: 7px auto;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    overflow: hidden;
    box-shadow:
        inset 0 1px 3px rgba(0,0,0,0.7),
        0 0 5px rgba(0,0,0,0.4);
}

.console-bar-fill {
    width: 0%;
    height: 100%;
    border-radius: inherit;

    background: linear-gradient(
        90deg,
        #e53935 0%,
        #ff5722 16%,
        #ff9800 32%,
        #ffc107 48%,
        #cddc39 64%,
        #4caf50 82%,
        #00c853 100%
    );

    transition:
        width .45s ease,
        background .35s ease;

    box-shadow:
        0 0 10px rgba(0,200,83,.55);
}

  /* ===== الشريط السفلي (Loading) ===== */
  .footer {
    flex: 0 0 auto;
    border: 1px solid rgba(180,140,40,.45);
    border-radius: 12px;
    background: rgba(15,15,18,.22);
backdrop-filter: blur(2px);
-webkit-backdrop-filter: blur(2px);
    padding: 8px 14px 12px;
    box-shadow: inset 0 0 20px rgba(0,0,0,.5);
  }
  .footer .loading-text {
    text-align: center;
    color: #f4c842;
    font-size: clamp(12px, 1.05vw, 15px);
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
    text-shadow: 0 0 12px rgba(244,200,66,.4);
  }
  .footer .bottom-progress {
    position: relative;
    width: calc(100% - 18px);
    height: 14px;
    margin: 6px auto 8px;

    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    overflow: hidden;

    box-shadow:
        inset 0 1px 3px rgba(0,0,0,0.7),
        0 0 5px rgba(0,0,0,0.4);
}
  .console-bar,
.bottom-progress {
  position: relative;
}

.progress-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 2;
  color: #fff;
  font-weight: 700;
  font-size: 10px;
  line-height: 1;
  text-shadow:
    0 1px 2px #000,
    0 0 5px #000;
  letter-spacing: .5px;
}
  .footer .bottom-progress-fill {
    width: 0%;
    height: 100%;
    border-radius: inherit;

    background: linear-gradient(
        90deg,
        #e53935 0%,
        #ff5722 16%,
        #ff9800 32%,
        #ffc107 48%,
        #cddc39 64%,
        #4caf50 82%,
        #00c853 100%
    );

    transition:
        width .45s ease,
        background .35s ease;

    box-shadow:
        0 0 12px rgba(0,200,83,.6);
}

  /* ===== الشاشات الصغيرة ===== */
  @media (max-width: 720px){
    #app { width: 94vw; height: 92vh; margin: 4vh auto; padding: 12px; }
    .panels { flex-direction: column; }
    .left-panel { flex: 0 0 auto; flex-direction: row; flex-wrap: wrap; }
    .card { flex: 1 1 30%; min-width: 100px; }
  }
</style>

<!-- ============================================================
     دوال الشريط + writeLog  —  قبل باقي السكربتات
     ============================================================ -->
<script>
  function showCurrentIP() {
    const ipElement = document.getElementById("ipValue");
    if (!ipElement) return;

    if (typeof get_current_ip !== "function") {
        ipElement.textContent = "------";
        return;
    }

    const ip = get_current_ip();

    ipElement.textContent = ip || "No Network";
}
/* ============ لوحة الألوان (7 ألوان) ============ */
const PALETTE = ['#e53935','#ff5722','#ff9800','#ffc107','#cddc39','#4caf50','#00c853'];

function hexToRgb(h){
  h = h.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function colorAt(percent){
  const t = Math.max(0, Math.min(1, percent/100)) * (PALETTE.length - 1);
  const i = Math.min(PALETTE.length - 2, Math.floor(t));
  const f = t - i;
  const a = hexToRgb(PALETTE[i]);
  const b = hexToRgb(PALETTE[i+1]);
  const c = a.map((v,k) => Math.round(v + (b[k]-v) * f));
  return '#' + c.map(v => v.toString(16).padStart(2,'0')).join('');
}

/* ============ الدالة الأساسية ============ */
window.updateProgress = function(percent){
  percent = Number(percent);

  if (!Number.isFinite(percent))
    return;

  percent = Math.max(0, Math.min(100, percent));

  const p = Math.round(percent);
  const color = colorAt(p);

  // ===== الأشرطة =====
  const cbar = document.getElementById('consoleBarFill');
  const bbar = document.getElementById('bottomBarFill');

  if (cbar) {
    cbar.style.width = p + '%';
    cbar.style.background =
      `linear-gradient(90deg,
        ${color},
        ${colorAt(Math.min(100, p + 12))})`;
    cbar.style.boxShadow = `0 0 12px ${color}`;
  }

  if (bbar) {
    bbar.style.width = p + '%';
    bbar.style.background =
      `linear-gradient(90deg,
        ${color},
        ${colorAt(Math.min(100, p + 12))})`;
    bbar.style.boxShadow = `0 0 16px ${color}`;
  }

  // ===== النسبة داخل الشريط =====
  const consoleText =
    document.getElementById('consoleProgressText');

  const bottomText =
    document.getElementById('bottomProgressText');

  if (consoleText)
    consoleText.textContent = p + '%';

  if (bottomText)
    bottomText.textContent = p + '%';

  // ===== بطاقة PERCENT =====
  const pct = document.getElementById('percentText');

  if (pct){
    const m = pct.textContent.match(/Remaining:\s*[^)]+/);

    pct.textContent =
      `${m ? m[0] : 'Remaining: --:--'} (${p}%)`;
  }

  // ===== بطاقة JBSTATUS =====
  const jb = document.getElementById('jbStatus');

  if (jb){
    const m = jb.textContent.match(/^[^(]+/);

    jb.textContent =
      `${m ? m[0].trim() : 'P2JB Injection'} (${p}%)`;
  }
};

/* ============ writeLog — بالوسيط الثالث ============ */
window.writeLog = function(message, type = 'log', progress = null){
  const out = document.getElementById('consoleOut');
  if (out){
    const line = document.createElement('div');
    line.textContent = message;
    if (type === 'error')        line.classList.add('err');
    else if (type === 'success') line.classList.add('green');
    else if (type === 'dim')     line.classList.add('dim');
    out.appendChild(line);
    out.scrollTop = out.scrollHeight;
  }
  if (progress !== null) window.updateProgress(progress);
};

/* ============ تهيئة أولية — صفوف الصورة ============ */
window.updateProgress(0);
window.writeLog('PS5 Y2JB Autoloader Edit By EYAD', 'log');
window.writeLog('Running Y2JB Exploit...', 'log');
window.writeLog('Starting Exploit', 'log');
</script>
